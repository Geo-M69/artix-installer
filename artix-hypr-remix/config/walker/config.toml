force_keyboard_focus = true
selection_wrap = true
theme = "ahr-default"
additional_theme_location = "~/.config/artix-hypr-remix/default/walker/themes/"
hide_action_hints = true

[placeholders]
default = { input = "Search...", list = "No results" }

[keybinds]
quick_activate = []

[columns]
symbols = 1

[providers]
max_results = 256
default = ["desktopapplications", "websearch", "files"]

[[providers.prefixes]]
prefix = "/"
provider = "providerlist"

[[providers.prefixes]]
prefix = "."
provider = "files"

[[providers.prefixes]]
prefix = ":"
provider = "symbols"

[[providers.prefixes]]
prefix = "="
provider = "calc"

[[providers.prefixes]]
prefix = "@"
provider = "websearch"

[[providers.prefixes]]
prefix = "$"
provider = "clipboard"

[[emergencies]]
text = "Restart Walker"
command = "bash ~/.config/artix-hypr-remix/bin/ahr-restart-walker"
