[manager]
sort_by = "alphabetical"
sort_sensitive = false
linemode = "none"
show_hidden = false
show_symlink = true

[preview]
max_width = 1200
max_height = 900
cache_dir = ""

[opener]
edit = [
	{ run = 'hx "$@"', block = true, desc = "Helix" }
]

[open]
rules = [
	{ mime = "text/*", use = "edit" }
]
