# Runtime Hyprland config for Artix OpenRC installs.
# Lua files in this repo are currently planning/source notes; this file is what Hyprland executes.

$mod = SUPER

monitor=,preferred,auto,1

env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = OZONE_PLATFORM,wayland
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = GTK_THEME,Adwaita:dark

general {
  gaps_in = 4
  gaps_out = 8
  border_size = 2
  layout = dwindle
}

decoration {
  rounding = 8
}

animations {
  enabled = yes
}

input {
  kb_layout = us
  kb_options = compose:caps
  repeat_rate = 40
  repeat_delay = 250
  follow_mouse = 1

  touchpad {
    natural_scroll = no
    scroll_factor = 0.4
  }
}

misc {
  disable_hyprland_logo = yes
  disable_splash_rendering = yes
}

# Autostart
exec-once = waybar
exec-once = mako
exec-once = swww-daemon
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = pipewire
exec-once = wireplumber
exec-once = pipewire-pulse

# Core binds
bind = $mod, RETURN, exec, ghostty
bind = $mod, SPACE, exec, walker
bind = $mod SHIFT, F, exec, nautilus
bind = $mod, q, killactive
bind = $mod SHIFT, q, exit
bind = $mod, v, togglefloating
bind = $mod, P, exec, cliphist list | walker -d | cliphist decode | wl-copy

# Focus movement
bind = $mod, h, movefocus, l
bind = $mod, j, movefocus, d
bind = $mod, k, movefocus, u
bind = $mod, l, movefocus, r

# Move windows
bind = $mod SHIFT, h, movewindow, l
bind = $mod SHIFT, j, movewindow, d
bind = $mod SHIFT, k, movewindow, u
bind = $mod SHIFT, l, movewindow, r

# Emergency fallback binds (independent of SUPER key)
bind = ALT, Return, exec, ghostty
bind = ALT, F4, killactive

# Workspace switching
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

# Mouse actions
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
