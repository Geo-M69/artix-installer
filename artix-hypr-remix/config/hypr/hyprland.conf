# Runtime Hyprland config for Artix OpenRC installs.
# Lua files in this repo are currently planning/source notes; this file is what Hyprland executes.

$mod = SUPER

monitor=,preferred,auto,auto

env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = OZONE_PLATFORM,wayland
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = GTK_THEME,Adwaita:dark

general {
  gaps_in = 4
  gaps_out = 8
  border_size = 2
  layout = dwindle
  allow_tearing = false
}

decoration {
  rounding = 8
  dim_inactive = true
  dim_strength = 0.08
}

animations {
  enabled = true
}

input {
  kb_options = compose:caps
  repeat_rate = 40
  repeat_delay = 250
  numlock_by_default = true

  touchpad {
    clickfinger_behavior = true
    scroll_factor = 0.4
  }
}

xwayland {
  force_zero_scaling = true
}

# Autostart
exec-once = waybar
exec-once = mako
exec-once = swww-daemon
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = pipewire
exec-once = wireplumber
exec-once = pipewire-pulse

# Core binds
bind = $mod, RETURN, exec, ghostty
bind = $mod, SPACE, exec, walker
bind = $mod SHIFT, F, exec, nautilus
bind = $mod, Q, killactive
bind = $mod SHIFT, Q, exit
bind = $mod, V, togglefloating
bind = $mod, P, exec, cliphist list | walker -d | cliphist decode | wl-copy

# Focus movement
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

# Move windows
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r

# Workspace switching
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

# Mouse actions
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
