# Runtime Hyprland config for Artix OpenRC installs.
# Lua files in this repo are currently planning/source notes; this file is what Hyprland executes.

$mod = SUPER

monitor=,preferred,auto,auto

env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = OZONE_PLATFORM,wayland
env = XCOMPOSEFILE,$HOME/.XCompose
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = GTK_THEME,Adwaita:dark

general {
  gaps_in = 4
  gaps_out = 8
  border_size = 2
  layout = dwindle
}

decoration {
  rounding = 8
  dim_inactive = yes
  dim_strength = 0.08
}

animations {
  enabled = yes
}

input {
  kb_layout = us
  kb_options = compose:caps
  repeat_rate = 40
  repeat_delay = 250
  numlock_by_default = true
  follow_mouse = 1

  touchpad {
    natural_scroll = no
    clickfinger_behavior = yes
    scroll_factor = 0.4
  }
}

xwayland {
  force_zero_scaling = true
}

ecosystem {
  no_update_news = true
}

misc {
  disable_hyprland_logo = yes
  disable_splash_rendering = yes
}

# Autostart
exec-once = bash ~/.config/artix-hypr-remix/bin/first-run.sh
exec-once = bash ~/.config/artix-hypr-remix/bin/hook.sh post-boot
exec-once = waybar
exec-once = mako
exec-once = bash ~/.config/artix-hypr-remix/bin/ahr-optional-elephant
exec-once = bash ~/.config/artix-hypr-remix/bin/ahr-launcher-service
exec-once = bash ~/.config/artix-hypr-remix/bin/ahr-launch-wallpaper-session
exec-once = hypridle
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = pipewire
exec-once = wireplumber
exec-once = pipewire-pulse

# Core binds
bind = $mod, RETURN, exec, bash ~/.config/artix-hypr-remix/bin/ahr-launch-terminal
bind = $mod, SPACE, exec, bash ~/.config/artix-hypr-remix/bin/ahr-menu
bind = $mod ALT, SPACE, exec, bash ~/.config/artix-hypr-remix/bin/ahr-menu
bind = $mod SHIFT, RETURN, exec, bash ~/.config/artix-hypr-remix/bin/ahr-launch-browser
bind = $mod SHIFT, F, exec, bash ~/.config/artix-hypr-remix/bin/ahr-launch-files
bind = $mod, w, killactive
bind = $mod, q, killactive
bind = $mod SHIFT, q, exit
bind = $mod, f, fullscreen
bind = $mod ALT, f, exec, hyprctl dispatch fullscreen 1
bind = $mod CTRL, f, exec, hyprctl dispatch fullscreenstate 0 2
bind = $mod, j, layoutmsg, togglesplit
bind = $mod, v, togglefloating
bind = $mod, t, togglefloating
bind = $mod CTRL, t, exec, bash ~/.config/artix-hypr-remix/bin/ahr-launch-terminal -e btop
bind = $mod CTRL, l, exec, bash ~/.config/artix-hypr-remix/bin/ahr-system-lock
bind = $mod, o, exec, hyprctl dispatch togglefloating && hyprctl dispatch pin
bind = $mod, s, togglespecialworkspace, scratchpad
bind = $mod ALT, s, movetoworkspace, special:scratchpad
bind = $mod, l, exec, hyprctl keyword general:layout "$(hyprctl getoption general:layout | grep -q 'str: \"dwindle\"' && echo master || echo dwindle)"
bind = $mod, g, togglegroup
bind = $mod ALT, g, moveoutofgroup
bind = CTRL ALT, DELETE, exec, while hyprctl clients | grep -q '^Window'; do hyprctl dispatch killactive; done
bind = $mod, P, exec, bash ~/.config/artix-hypr-remix/bin/ahr-clipboard-picker
bind = $mod, TAB, workspace, e+1
bind = $mod SHIFT, TAB, workspace, e-1
bind = $mod CTRL, TAB, workspace, previous

# Notification controls
bind = $mod, COMMA, exec, makoctl dismiss
bind = $mod SHIFT, COMMA, exec, makoctl dismiss --all
bind = $mod ALT, COMMA, exec, makoctl invoke
bind = $mod SHIFT ALT, COMMA, exec, makoctl restore
bind = $mod CTRL, COMMA, exec, bash ~/.config/artix-hypr-remix/bin/ahr-toggle-notification-silencing
bind = $mod CTRL, i, exec, bash ~/.config/artix-hypr-remix/bin/ahr-toggle-idle

# Screenshot
bind = , PRINT, exec, grim -g "$(slurp)" "$HOME/Pictures/screenshot-$(date +%s).png"

# Focus movement
bind = $mod, h, movefocus, l
bind = $mod, k, movefocus, u
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Group controls
bind = $mod CTRL, left, changegroupactive, b
bind = $mod CTRL, right, changegroupactive, f
bind = $mod CTRL, up, changegroupactive, b
bind = $mod CTRL, down, changegroupactive, f
bind = $mod ALT, left, moveintogroup, l
bind = $mod ALT, right, moveintogroup, r
bind = $mod ALT, up, moveintogroup, u
bind = $mod ALT, down, moveintogroup, d
bind = $mod ALT, 1, changegroupactive, 1
bind = $mod ALT, 2, changegroupactive, 2
bind = $mod ALT, 3, changegroupactive, 3
bind = $mod ALT, 4, changegroupactive, 4

# Move windows
bind = $mod SHIFT, h, movewindow, l
bind = $mod SHIFT, j, movewindow, d
bind = $mod SHIFT, k, movewindow, u
bind = $mod SHIFT, l, movewindow, r
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

# Emergency fallback binds (independent of SUPER key)
bind = ALT, Return, exec, bash ~/.config/artix-hypr-remix/bin/ahr-launch-terminal
bind = ALT, F4, killactive

# Workspace switching
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT ALT, 1, exec, hyprctl dispatch movetoworkspacesilent 1
bind = $mod SHIFT ALT, 2, exec, hyprctl dispatch movetoworkspacesilent 2
bind = $mod SHIFT ALT, 3, exec, hyprctl dispatch movetoworkspacesilent 3
bind = $mod SHIFT ALT, 4, exec, hyprctl dispatch movetoworkspacesilent 4
bind = $mod SHIFT ALT, 5, exec, hyprctl dispatch movetoworkspacesilent 5

# Mouse actions
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Media keys
bindel = , XF86AudioRaiseVolume, exec, pamixer -i 5
bindel = , XF86AudioLowerVolume, exec, pamixer -d 5
bindl = , XF86AudioMute, exec, pamixer -t
bindl = , XF86AudioMicMute, exec, pamixer --default-source -t
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
